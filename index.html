
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend Day ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

</head>

<body>
  <div id="lockScreen">
  <div class="lock-box">
    <img src="assets/teddy.png" alt="Teddy" class="teddy">

    <h1>🧸 Welcome My Princess 💖</h1>
    <p>Enter the Secret Password to Unlock My Heart ❤️</p>

    <input
      type="password"
      id="password"
      placeholder="Enter Password">

    <button onclick="checkPassword()">
      Unlock ❤️
    </button>

    <p id="errorMsg"></p>
  </div>
  </div>

<audio id="bgMusic" loop>
  <source src="assets/IshqSufiyana.mp3" type="audio/mpeg">
</audio>

<div id="intro" style="display:none;">

<h1>Happy Girlfriend Day ❤️</h1>

<h2>For My Beautiful Girl</h2>

<h3>Sanhya ✨</h3>

<button onclick="startLove()">

Open My Heart ❤️

</button>

</div>

<div id="main">

<div class="stars"></div>

<div class="overlay">

<h1 class="name">

Dear Sanhya ❤️

</h1>

<p id="typing"></p>

<div id="timer">

<h2>Together Since ❤️</h2>

<h3>17 April</h3>

<p id="loveTimer"></p>

</div>

<button onclick="showEnding()">

One Last Surprise 💖

</button>

</div>

</div>

<div id="ending">

<h1>

Forever & Always ❤️

</h1>

<p>

No matter where life takes us...

My Heart Will Always Choose You.

</p>

<h2>

❤️ Shivansh ❤️

</h2>

</div>

<script src="script.js"></script>

</body>
</html>
